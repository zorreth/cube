services:
  postgres:
    image: postgres:alpine
    restart: always
    shm_size: 128mb
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/posgresql
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - 8080:8080
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/app
      - JWT_SECRET=verysecret

volumes:
  pgdata:
